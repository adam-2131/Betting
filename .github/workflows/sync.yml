# Scheduled sync, run by GitHub Actions.
#
# The sync does not fit in a serverless function — a pass takes minutes against a hosted database,
# where Vercel's hobby functions cap at sixty seconds. An Actions job may run for six hours, which
# is far more headroom than this needs.
#
# Cost: nothing. Actions has no minute cap on public repositories, and 2,000 minutes a month on
# private ones — enough for a two-hourly pass but not a quarter-hourly one. If the repo is
# private, widen the schedule or the allowance runs out mid-month.
#
# No secret lives in this file. Everything comes from repository secrets, and the data lives in
# the database rather than the repo, so a public repo exposes code and nothing else.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# STAGE ORDER IS THE LOAD-BEARING DECISION HERE, and it is not the order the stages logically run
# in. The first hosted attempts ran `markets → traders → scores → opportunities` in one command,
# exactly as a local sync does. The trader stage is by far the slowest, it was killed by the job
# timeout on all three attempts, and because it sat in front of the scoring stages those never ran
# at all. The database held 13,276 open positions and the site showed an empty board.
#
# So the cheap stages that produce the visible output run FIRST, in their own step, on whatever
# trader data already exists. Refreshing the watchlist runs last, in a step allowed to fail. A
# timeout now truncates the least valuable work instead of all of it, and every pass leaves the
# board current even if only part of the watchlist got refreshed.
# ─────────────────────────────────────────────────────────────────────────────────────────────────
name: sync

on:
  schedule:
    # Every thirty minutes, because that is longer than a pass takes. A measured healthy run is
    # 26.6 minutes — 14 in the pricing and scoring step, 12.2 in the watchlist step — and the
    # schedule was every fifteen. Since `cancel-in-progress` is false, each pass was still
    # running when the next was due, so runs queued and fell further behind; two of the first
    # four were cancelled after sitting for 21 and 40 minutes. A schedule shorter than the work
    # it triggers does not sync more often, it just builds a backlog.
    #
    # Freshness costs nothing here: the board step alone takes 14 minutes, so a quarter-hourly
    # refresh was never achievable, and the app raises its own alert if no sync lands in three
    # hours. If this ever needs to be genuinely frequent, the answer is two workflows — the cheap
    # board refresh on its own schedule and the watchlist on a slower one — not a tighter cron.
    - cron: "*/30 * * * *"
    # Gates the maintenance job below.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: polyalpha-sync
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
  PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}

  # Retention and limits. Repository VARIABLES rather than secrets: none is sensitive, and a
  # variable appears in the run log, which makes a misconfiguration visible instead of mysterious.
  # The fallbacks mean the workflow is correct with nothing configured — without them a free-tier
  # database fills up, since an unbounded instance reached 3 GB in a day against a 0.5 GB cap.
  RETAIN_ACTIVITY_DAYS: ${{ vars.RETAIN_ACTIVITY_DAYS || '21' }}
  RETAIN_SNAPSHOT_DAYS: ${{ vars.RETAIN_SNAPSHOT_DAYS || '14' }}
  RETAIN_RESOLVED_MARKET_DAYS: ${{ vars.RETAIN_RESOLVED_MARKET_DAYS || '14' }}
  MAX_WATCHLIST: ${{ vars.MAX_WATCHLIST || '200' }}
  SYNC_MARKET_LIMIT: ${{ vars.SYNC_MARKET_LIMIT || '250' }}
  # Deliberately small. A wallet seen for the first time costs twenty-odd paginated requests and
  # a deep history write, so a large budget is what made this stage outrun the timeout. The
  # watchlist is covered incrementally across passes instead, which the refresh tiering in
  # `trader-selection.ts` is built for.
  SYNC_TRADER_LIMIT: ${{ vars.SYNC_TRADER_LIMIT || '25' }}
  SYNC_TRADER_CONCURRENCY: ${{ vars.SYNC_TRADER_CONCURRENCY || '6' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The embedded-postgres platform binaries only serve `npm run db:local`, which a scheduled
      # sync never uses. Skipping them saves a large download every run.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --omit=optional

      - name: Generate Prisma client
        run: npx prisma generate

      # Idempotent, so a schema change ships with the next sync rather than needing a separate
      # migration step against a database you cannot reach from your laptop.
      - name: Apply schema
        run: npx prisma db push --skip-generate --accept-data-loss

      # THE STEP THAT MATTERS. Cheap, and it is what puts anything on the screen: refresh prices,
      # rescore what is already known, price the bets, raise alerts. Runs before the expensive
      # stage so a timeout can never leave the board empty again.
      - name: Refresh prices and rescore
        timeout-minutes: 25
        run: npm run sync -- --only=markets,relink,scores,opportunities,bets,notify

      # Expensive and incremental, so it comes last and is allowed to fail. Whatever it manages
      # this pass is picked up by the next one; whatever it does not, the previous pass already
      # covered. `continue-on-error` keeps a slow watchlist refresh from marking the run red when
      # the useful work above succeeded.
      - name: Refresh part of the watchlist
        timeout-minutes: 20
        continue-on-error: true
        run: npm run sync -- --only=traders

  # Once a day: widen the watchlist, then trim it back to the cap and drop old rows.
  #
  # Discovery is NOT run on manual dispatch, which was the other half of the earlier problem — the
  # gate said `|| workflow_dispatch`, so every hand-triggered run added hundreds of wallets, and
  # the watchlist grew from 200 to 1,053 far faster than it could be synced. Pruning follows
  # immediately in the same job so the cap is enforced in the same pass that widens it.
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event.schedule == '0 4 * * *'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --omit=optional
      - run: npx prisma generate
      - name: Discover new wallets, then enforce the cap
        run: npm run sync -- --only=discover,prune
